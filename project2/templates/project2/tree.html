{% extends "project2/base.html" %} {% block content %}

<div class="card">
  <h1>Decision Tree</h1>
  <p><strong>Test Accuracy:</strong> {{ accuracy }}%</p>
  <p><strong>Number of Leaves:</strong> {{ leaves }}</p>
</div>

<div class="card">
  <h2>Decision Tree Visualization</h2>
  <img src="{{ tree_image }}" alt="Decision Tree" />
</div>

<div class="horizontal-layout">
  <div class="half-card">
    <h2>Confusion Matrix</h2>
    <img src="{{ confusion_matrix }}" alt="Confusion Matrix" />
  </div>

  <div class="half-card">
    <h2>ROC Curve</h2>
    <img src="{{ roc_curve }}" alt="ROC Curve" />
  </div>
</div>

{% endblock %}
