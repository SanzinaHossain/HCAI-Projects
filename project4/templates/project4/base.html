{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Movie Preference Study{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'project4/css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header">
        <div>
          <div class="eyebrow">
            HUMAN-CENTRIC ARTIFICIAL INTELLIGENCE · PROJECT 4
          </div>
          <h1>Movie Preference Study</h1>
        </div>
        <nav class="header-nav" aria-label="Project navigation">
          <a class="ghost" href="/">Main Home Page</a>
          <a class="ghost" href="{% url 'project4:landing' %}"
            >Project 4 HomePage</a
          >
        </nav>
      </div>
    </header>

    <main class="wrap">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span>Project 4 · Preference Elicitation</span>
        <span
          ><a href="/">Main Home</a> ·
          <a href="{% url 'project4:landing' %}">Project 4 Home</a></span
        >
      </div>
    </footer>

    <script src="{% static 'project4/js/app.js' %}"></script>
  </body>
</html>
